name: collect-us-market

on:
  schedule:
    # UTC 15:00~21:30 = KST 00:00~06:30, 30분 간격 (미국 정규장 요일 기준 월~금)
    - cron: '*/30 15-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet yfinance
      - run: python scripts/collect.py
      - name: commit snapshot
        run: |
          git config user.name  "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add snapshots
          git diff --staged --quiet && exit 0
          git commit -m "snapshot $(date -u +%FT%H:%MZ)"
          git pull --rebase --autostash
          git push
